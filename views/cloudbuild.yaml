# One-step rebuild of heat-views: fetch T12 layers, build route heat from BigQuery (final T08 if
# gs://hackaton-honory-heat/T08/_SUCCESS exists, else the stub), build the image, deploy.
#   gcloud builds submit --config views/cloudbuild.yaml --region europe-central2 --ignore-file views/.gcloudignore views
# Force a heat source with --substitutions _HEAT=final (or stub).
substitutions:
  _HEAT: auto
  _IMG: europe-central2-docker.pkg.dev/hackaton-honory/hackathon/heat-views:latest
steps:
  - id: t12
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        rm -rf site/data && mkdir -p site/data/t12/frames
        gsutil -q -m cp -r gs://hackaton-honory-heat/T12/points gs://hackaton-honory-heat/T12/scene gs://hackaton-honory-heat/T12/series gs://hackaton-honory-heat/T12/manifest.json site/data/t12/
        gsutil -q -m cp 'gs://hackaton-honory-heat/T12/frames/*.png' site/data/t12/frames/
        for d in shadow_solweig shadow_solweig_4m utci utci_value tmrt tmrt_value; do
          gsutil -q -m cp -r gs://hackaton-honory-heat/T12/frames/$$d site/data/t12/frames/
        done
        rm -f site/data/t12/points/*.parquet
        du -sh site/data/t12
  - id: routes
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        pip install -q google-cloud-bigquery google-cloud-storage numpy
        python build_data.py --out site/data --heat ${_HEAT}
  - id: image
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMG}", "."]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMG}"]
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ["run", "deploy", "heat-views", "--image", "${_IMG}", "--region", "europe-central2", "--port", "8080",
           "--cpu", "1", "--memory", "512Mi", "--max-instances", "4", "--quiet"]
images: ["${_IMG}"]
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
