server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json application/geo+json application/octet-stream text/css application/javascript text/plain image/svg+xml;
  types { application/geo+json geojson; application/octet-stream bin; }
  location = / { return 302 /routes/; }
  location = /routes { return 301 /routes/; }
  location = /shadows3d { return 301 /shadows3d/; }
  location = /temperature { return 301 /temperature/; }
  location /data/ { add_header Cache-Control "public, max-age=3600"; add_header Access-Control-Allow-Origin "*"; }
  location / { add_header Cache-Control "public, max-age=300"; try_files $uri $uri/ =404; }
}
